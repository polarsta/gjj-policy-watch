# 放在 gjj-policy-watch 仓库的 .github/workflows/ 下
# 作用：数据库文件变更时，自动同步最新副本到 docs/db.json（GitHub Pages 目录）
name: publish-db

on:
  push:
    branches: [main]
    paths:
      - "data/gjj_policy_database.json"   # 仅数据库变更时触发（如 weekly PR 合并）
  workflow_dispatch:                      # 支持手动触发

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步数据库到 Pages 目录
        run: |
          mkdir -p docs
          cp data/gjj_policy_database.json docs/db.json
          # 可选：同时同步变更日志，供前端"本周更新"板块使用
          [ -f data/change_log.json ] && cp data/change_log.json docs/change_log.json || true

      - name: 提交并推送（Pages 将自动重新部署）
        run: |
          git config user.email "gjj-watch-bot@users.noreply.github.com"
          git config user.name "gjj-watch-bot"
          git add docs/db.json docs/change_log.json 2>/dev/null || git add docs/db.json
          if git diff --cached --quiet; then
            echo "db.json 无内容变化，跳过"
            exit 0
          fi
          git commit -m "chore(publish): sync db.json $(date +%Y-%m-%d)"
          git push
