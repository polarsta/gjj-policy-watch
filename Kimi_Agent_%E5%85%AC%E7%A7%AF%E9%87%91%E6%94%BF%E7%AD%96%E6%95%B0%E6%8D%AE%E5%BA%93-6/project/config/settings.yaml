date_window_days: 7
request_timeout: 15
request_delay: 1.0
user_agent: Mozilla/5.0 (compatible; gjj-policy-watch/1.0)
keywords:
- 缴存基数
- 贷款额度
- 最高额度
- 提取
- 利率
- 首付
- 调整
- 优化
- 新政
- 通知
- 签约
- 合作
- 宣讲
- 受托
- 商转公
- 代办
- 银行
- 条例
- 实施细则
- 灵活就业
- 装修
- 物业费
- 异地贷款
search:
  backend: bing_html
  results_per_query: 10
  policy_terms:
  - 贷款
  - 提取
  - 缴存
  - 利率
  - 首付
  - 银行 合作
  - 商转公
  - 宣讲
  domain_boost:
  - gov.cn
llm:
  enabled: false
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
notify:
  console: true
  webhook_url: ''
  smtp:
    enabled: false
    host: ''
    port: 465
    user: ''
    to: []
paths:
  db: data/gjj_policy_database.json
  seen: data/seen_announcements.json
  snapshots: data/snapshots
  change_log: data/change_log.json
  reports: reports
