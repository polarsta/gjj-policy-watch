<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国公积金政策数据库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f7f6f3; color: #2c2a26; }
  header { background: #fdfcfa; border-bottom: 1px solid #e8e4dc; padding: 20px 24px;
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 20px; font-weight: 600; color: #4a4237; }
  header .meta { font-size: 12px; color: #9a917f; margin-top: 4px; }
  .controls { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  input, select { padding: 8px 12px; border: 1px solid #ddd6c9; border-radius: 8px;
                  font-size: 14px; background: #fff; }
  input { flex: 1; min-width: 180px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .city-list { background: #fff; border: 1px solid #e8e4dc; border-radius: 12px;
               max-height: 70vh; overflow-y: auto; }
  .city-item { padding: 10px 16px; cursor: pointer; font-size: 14px;
               border-bottom: 1px solid #f3f0e9; display: flex; justify-content: space-between; }
  .city-item:hover { background: #faf7f0; }
  .city-item.active { background: #f3ede1; border-left: 3px solid #a88b5f; font-weight: 600; }
  .city-item .prov { color: #b0a794; font-size: 12px; }
  .detail { background: #fff; border: 1px solid #e8e4dc; border-radius: 12px; padding: 24px; }
  .detail h2 { font-size: 22px; color: #4a4237; margin-bottom: 4px; }
  .detail .updated { font-size: 12px; color: #9a917f; margin-bottom: 20px; }
  .section { margin-bottom: 24px; }
  .section h3 { font-size: 15px; color: #a88b5f; border-bottom: 2px solid #f0e9db;
                padding-bottom: 6px; margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; font-size: 14px; }
  .kv dt { color: #8a8171; } .kv dd { color: #2c2a26; }
  .tags span { display: inline-block; background: #f5f0e6; color: #6d6350; font-size: 12px;
               padding: 3px 10px; border-radius: 20px; margin: 0 6px 6px 0; }
  .sources { font-size: 13px; }
  .sources a { color: #7a6a4f; word-break: break-all; }
  .sources li { margin-bottom: 6px; }
  .note { background: #fbf8f1; border-left: 3px solid #d9c9a3; padding: 10px 14px;
          font-size: 13px; color: #6d6350; border-radius: 0 8px 8px 0; margin-top: 10px; }
  .empty { color: #b0a794; text-align: center; padding: 60px 0; font-size: 14px; }
  #status { font-size: 13px; color: #9a917f; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>全国住房公积金政策数据库</h1>
  <div class="meta" id="dbMeta">加载中…</div>
  <div class="controls">
    <input id="search" type="text" placeholder="搜索城市名 / 省份…">
    <select id="provFilter"><option value="">全部省份</option></select>
  </div>
</header>
<main>
  <div class="grid">
    <div class="city-list" id="cityList"></div>
    <div class="detail" id="detail"><div class="empty">← 选择左侧城市查看政策详情</div></div>
  </div>
</main>

<script>
/* ============ 数据接入：唯一需要改的就是这一行 ============ */
const DB_URL = './db.json';   // 同域 Pages 部署；也可改为其他绝对URL
/* =========================================================== */

let DB = null;

const $ = id => document.getElementById(id);
const fmt = v => (v === null || v === undefined || v === '' ) ? '—'
               : Array.isArray(v) ? v.join('、') : String(v);

async function load() {
  try {
    // ?v= 时间戳防 CDN 缓存，保证每次拿到最新库
    const res = await fetch(DB_URL + (DB_URL.includes('?') ? '&' : '?') + 'v=' + Date.now());
    DB = await res.json();
    $('dbMeta').textContent =
      `${DB.database} ｜ 版本 ${DB.version} ｜ ${DB.city_count} 城市 ｜ 数据更新于 ${DB.generated_at}`;
    initFilters();
    renderList(DB.cities);
  } catch (e) {
    $('dbMeta').textContent = '数据加载失败：' + e.message;
  }
}

function initFilters() {
  const provs = [...new Set(DB.cities.map(c => c.province).filter(Boolean))].sort();
  provs.forEach(p => {
    const o = document.createElement('option'); o.value = o.textContent = p;
    $('provFilter').appendChild(o);
  });
  $('search').oninput = applyFilter;
  $('provFilter').onchange = applyFilter;
}

function applyFilter() {
  const q = $('search').value.trim();
  const p = $('provFilter').value;
  renderList(DB.cities.filter(c =>
    (!p || c.province === p) &&
    (!q || c.city.includes(q) || (c.province || '').includes(q) ||
     (c.search_aliases || []).some(a => a.includes(q)))));
}

function renderList(cities) {
  $('cityList').innerHTML = cities.map(c =>
    `<div class="city-item" data-city="${c.city}">
       <span>${c.city}</span><span class="prov">${c.province || ''}</span>
     </div>`).join('') || '<div class="empty">无匹配城市</div>';
  document.querySelectorAll('.city-item').forEach(el =>
    el.onclick = () => {
      document.querySelectorAll('.city-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      renderDetail(DB.cities.find(c => c.city === el.dataset.city));
    });
}

function srcList(sources) {
  if (!sources || !sources.length) return '';
  return `<ul class="sources">` + sources.map(s =>
    `<li><a href="${s.url}" target="_blank" rel="noopener">${s.title || s.url}</a>
     ${s.date ? `<span style="color:#b0a794">（${s.date}）</span>` : ''}</li>`).join('') + `</ul>`;
}

function renderDetail(c) {
  const d = c.deposit || {}, w = c.withdrawal || {}, l = c.loan || {};
  $('detail').innerHTML = `
    <h2>${c.city}${c.full_name ? `（${c.full_name}）` : ''}</h2>
    <div class="updated">数据更新：${c.last_updated || '—'}　｜　官网：${
      c.official_site ? `<a href="${c.official_site}" target="_blank">${c.official_site}</a>` : '未收录'}</div>

    <div class="section"><h3>缴存政策</h3>
      <dl class="kv">
        <dt>基数上限</dt><dd>${fmt(d.base_upper)} 元/月</dd>
        <dt>基数下限</dt><dd>${fmt(d.base_lower)} 元/月</dd>
        <dt>缴存比例</dt><dd>${fmt(d.ratio)}</dd>
        <dt>执行年度</dt><dd>${fmt(d.period)}</dd>
      </dl>
      ${d.note ? `<div class="note">${d.note}</div>` : ''}${srcList(d.sources)}
    </div>

    <div class="section"><h3>提取政策</h3>
      <div class="tags">${(w.conditions || []).map(x => `<span>${x}</span>`).join('')}</div>
      <dl class="kv"><dt>租房提取</dt><dd>${fmt(w.rent_limit)}</dd></dl>
      ${w.note ? `<div class="note">${w.note}</div>` : ''}${srcList(w.sources)}
    </div>

    <div class="section"><h3>贷款政策</h3>
      <dl class="kv">
        <dt>单人最高额度</dt><dd>${fmt(l.max_single)}</dd>
        <dt>家庭最高额度</dt><dd>${fmt(l.max_family)}</dd>
        <dt>首套利率</dt><dd>${fmt(l.rate_first)}</dd>
        <dt>二套利率</dt><dd>${fmt(l.rate_second)}</dd>
        <dt>首套首付</dt><dd>${fmt(l.down_payment_first)}</dd>
        <dt>二套首付</dt><dd>${fmt(l.down_payment_second)}</dd>
        <dt>贷款条件</dt><dd>${fmt(l.conditions)}</dd>
      </dl>
      ${l.note ? `<div class="note">${l.note}</div>` : ''}${srcList(l.sources)}
    </div>`;
}

load();
</script>
</body>
</html>
